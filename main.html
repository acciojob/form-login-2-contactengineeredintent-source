<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
	<link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
</head>

<body>
	<!-- the entire body must be written by student -->
    <div>
      <form class="form m-3">
        <div class="m-2">
          <label class="form-label" for="firstName" >First Name:</label>
          <input type="text" class="form-control" id="firstName" name="First Name" required>
        </div>
        <div class="m-2">
          <label class="form-label" for="lastName">Last Name:</label>
          <input type="text" class="form-control" id="lastName" name="Last Name" required>
        </div>
        <div class="m-2">
          <label class="form-label" for="pNumber">Phone Numeber:</label>
          <input type="number" class="form-control" id="pNumber" name="Phone Number" required>
        </div>
        <div class="m-2">
          <label class="form-label" for="email">Email:</label>
          <input type="email" class="form-control" id="email" name="Email ID" required>
        </div>
        <button id="submitBtn" class="btn btn-danger ms-2 mt-4">Submit</button>
      </form>
    </div>
	<script type="text/javascript" src="./script.js">
</script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  

</body>

</html>
